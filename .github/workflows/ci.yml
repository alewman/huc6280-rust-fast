name: CI

# Kept small: main and pull requests, superseded runs cancelled. The full
# SingleStepTests corpus (rung 2), the full scenario set, the MAME replays
# (rung 5) and the seeded faults (rung 6) run by hand (README).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  rungs:
    name: rungs 1-5 against huc6280-python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "pypy3.11"
      - name: cc65 (assembles Dormann's test)
        run: sudo apt-get install -y -q cc65
      - name: the reference at its pin, the vectors and Dormann's source
        run: |
          PYTHON=python scripts/fetch_huc6280python.sh
          scripts/fetch_vectors.sh
          scripts/fetch_dormann.sh
      - name: "rung 2: SingleStepTests, 100 cases an opcode, both formulas"
        run: LIMIT=100 JOBS=4 scripts/rung2.sh
      - name: "rung 3: Dormann natively"
        run: scripts/rung3.sh
      - name: "rung 1: the directed scenarios in lockstep (quick set)"
        run: QUICK=1 scripts/rung1.sh
      - name: "rung 4: interrupts in lockstep (quick set)"
        run: QUICK=1 scripts/rung4.sh
      - name: "rung 5: the synthetic program (no MAME traces here)"
        run: STEPS=600000 scripts/rung5.sh
