[package]
name = "huc6280-rust"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "A Rust Hudson HuC6280 core transcribed from, and proven equivalent to, huc6280-python"
license = "MIT"
repository = "https://github.com/alewman/huc6280-rust"
readme = "README.md"
publish = false

[lib]
name = "huc6280"

[dependencies]
# 6502-rust (crate sixfiveohtwo): the 65xx-family frame (interrupt requests,
# the poll, step()'s skeleton), as huc6280-python builds on 6502-python's
# CPUFrame. The pin a2600-rust uses.
sixfiveohtwo = { git = "https://github.com/alewman/6502-rust", rev = "71747eb9036702109fb206eb9fe88174a9dcc989" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
